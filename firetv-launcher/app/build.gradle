plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fitterlotto.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fitterlotto.tvlauncher'
        minSdk 22          // Fire OS 5 and newer
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded straight away.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
